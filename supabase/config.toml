# Configuração do projeto Supabase enviada com `npx supabase config push`.
# Só o que está declarado aqui é alterado no servidor; o resto fica como está no painel.
project_id = "frota"

[auth]
# Para onde o link do e-mail de confirmação leva (painel publicado na Vercel)
site_url = "https://g2frota.vercel.app"
additional_redirect_urls = ["https://g2frota.vercel.app/**", "https://frota-cyan.vercel.app/**", "http://localhost:8081/**"]
# Todo mundo entra com senha (motorista com CPF). A ativação de aparelho por código, com
# sessão anônima, foi aposentada na migration contas_e_assinatura.
enable_anonymous_sign_ins = false

# E-mail de "Esqueci minha senha" em português: supabase/templates/recuperar-senha.html.
# O Supabase só aceita modelo próprio com um SMTP configurado (no grátis, sem SMTP, recusa).
# Depois de configurar o SMTP, ativar com:
# [auth.email.template.recovery]
# subject = "Frota: criar senha nova"
# content_path = "./supabase/templates/recuperar-senha.html"

# Cria logins e redefine senhas (service_role). O token do usuário é conferido dentro da
# função (auth.getUser), por isso a verificação automática de JWT fica desligada.
[functions.gerenciar-usuario]
verify_jwt = false
